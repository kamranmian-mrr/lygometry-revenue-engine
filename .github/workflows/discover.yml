name: Lygometry Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run discovery engine
        run: |
          python engine/discover.py

      - name: Run quality checks
        run: |
          if [ -f engine/qa.py ]; then python engine/qa.py; fi

      - name: Build opportunity candidates
        run: |
          python engine/opportunities.py

      - name: Run opportunity quality checks
        run: |
          python engine/opportunity_qa.py

      - name: Run opportunity decision checks
        run: |
          python engine/opportunity_decisions_qa.py

      - name: Commit discovery results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new discovery data to commit."
          else
            git commit -m "Update Lygometry discovery signals"
            git push
          fi
